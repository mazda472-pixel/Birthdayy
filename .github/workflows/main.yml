workflow_dispatch:
​jobs:
build-android-apk:
runs-on: ubuntu-latest
​steps:
- name: 1. Скачиваем файлы репозитория
uses: actions/checkout@v4
​- name: 2. Устанавливаем Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 3. Устанавливаем Node.js
uses: actions/setup-node@v4
with:
node-version: '20'
​- name: 4. Подготавливаем веб-папку www
run: |
mkdir -p www
if [ -f "index.html" ]; then
cp index.html www/index.html
elif [ -f "birthdays.html" ]; then
cp birthdays.html www/index.html
else
echo "Ошибка: не найден файл index.html или birthdays.html!"
exit 1
fi
​- name: 5. Создаём Android-проект через Capacitor
run: |
npm init -y
npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
npx cap init "Дни рождения" "com.pink.birthdays" --web-dir=www
npx cap add android
npx cap sync android
​- name: 6. Настраиваем цвет статус-бара в розовый (#EC4899)
run: |
COLORS_FILE="android/app/src/main/res/values/colors.xml"
if [ -f "$COLORS_FILE" ]; then
sed -i 's/#3F51B5/#EC4899/g' "$COLORS_FILE"
sed -i 's/#303F9F/#DB2777/g' "$COLORS_FILE"
sed -i 's/#FF4081/#F43F5E/g' "$COLORS_FILE"
fi
​- name: 7. Собираем установочный APK
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
​- name: 8. Переименовываем APK и сохраняем для скачивания
run: |
cp android/app/build/outputs/apk/debug/app-debug.apk Birthdays.apk
​- name: 9. Загружаем готовый Birthdays.apk в Artifacts
uses: actions/upload-artifact@v4
with:
name: Birthdays-Android-APK
path: Birthdays.apk
retention-days: 30
